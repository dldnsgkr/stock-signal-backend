name: Deploy to EC2

on:
  push:
    tags:
      - 'v*'

jobs:
  # 배포 전 게이트: API 빌드 + 스코어러 테스트가 통과해야 deploy 가 돈다.
  # (SSH 로 서버에서 빌드하다 실패하면 서비스가 어정쩡한 상태로 남을 수 있어,
  #  서버를 건드리기 전에 CI 에서 먼저 검증한다.)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: API build (prisma generate + nest build)
        run: cd apps/api && pnpm prisma:generate && pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scorer unit tests
        run: |
          cd apps/analysis-service
          pip install numpy pytest
          pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ${{ github.ref_name }} to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            set -e
            cd ~/stock-signal-backend

            echo "=== Deploying tag: $GITHUB_REF_NAME ==="
            git fetch --tags
            git reset --hard
            git checkout $GITHUB_REF_NAME

            echo "=== pnpm install ==="
            sudo corepack enable
            pnpm install

            echo "=== prisma generate & migrate ==="
            cd apps/api
            pnpm prisma:generate
            pnpm prisma migrate deploy
            cd ~/stock-signal-backend

            echo "=== API build ==="
            cd apps/api
            pnpm build
            cd ~/stock-signal-backend

            echo "=== Python venv & deps ==="
            sudo apt-get install -y python3.12-venv
            cd apps/analysis-service
            python3 -m venv .venv
            .venv/bin/pip install -r requirements.txt
            cd ~/stock-signal-backend

            echo "=== PM2 reload: API ==="
            pm2 reload stock-signal-api || pm2 start ecosystem.config.js --only stock-signal-api --env production

            echo "=== PM2 restart worker ==="
            # 재시작을 건너뛰면 worker 가 옛 빌드를 계속 실행한다 (실제로 38일간 그래서
            # 수익률 평가가 두 달간 잘못 기록됐다). 파이프라인이 돌고 있으면 끝나길
            # 최대 10분 기다린 뒤 재시작한다.
            for i in $(seq 1 20); do
              ACTIVE=$(redis-cli llen bull:run-pipeline:active 2>/dev/null || echo 0)
              if [ "$ACTIVE" = "0" ]; then break; fi
              echo "pipeline running — waiting ($i/20)"
              sleep 30
            done
            pm2 restart stock-signal-worker || pm2 start ecosystem.config.js --only stock-signal-worker --env production

            echo "=== PM2 reload analysis ==="
            pm2 reload stock-signal-analysis || pm2 start ecosystem.config.js --only stock-signal-analysis --env production

            pm2 save

            echo "=== Deploy $GITHUB_REF_NAME complete ==="
