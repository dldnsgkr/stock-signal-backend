# 성과 평가 + 보존 창 정리 — EC2 의 15:00 UTC 평가 cron 대체.
# 평가(EW_INDEX 재구축 + 수익률/알파) 후 Neon 무료 한도 유지용 정리를 돌린다.
name: evaluate

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST (EC2 스케줄러와 동일)
  workflow_dispatch:

concurrency:
  group: evaluate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
      ANALYSIS_SERVICE_URL: http://localhost:8000
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: DB 주소 준비 (직결)
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_URL" ]; then
            echo "::error::NEON_DATABASE_URL secret 이 없습니다"; exit 1
          fi
          echo "DATABASE_URL=${NEON_URL/-pooler/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/api prisma:generate
      - run: pnpm -C apps/api build

      - name: worker 기동   # 평가는 분석서비스 불필요 (가격·지수는 DB 에서 계산)
        run: |
          nohup node apps/api/dist/main.worker.js > /tmp/worker.log 2>&1 &
          for i in $(seq 1 15); do
            grep -q "Worker process started" /tmp/worker.log && { echo "worker OK"; exit 0; }
            sleep 2
          done
          echo "::error::worker 기동 실패"; tail -50 /tmp/worker.log; exit 1

      - name: 평가 실행 (완주 대기)
        working-directory: apps/api
        # 평소 35~40분이지만 평가 대상이 몰리면(대조용 수동 런이 겹친 10-15) 75분을 넘겼다.
        # 결과는 건별 upsert 라 다음 날 이어서 하지만, 여유를 4배로 둔다.
        run: node scripts/run-queue-job.js evaluate-recommendations evaluate '{}' 160

      # 피처 스냅샷은 반사실 재채점(이 프로젝트의 검증 방법)의 원료라 버리면 안 되지만,
      # 거래일마다 ~10MB 라 Neon 512MB 에 둘 수 없다. 7일 지난 분을 내보내 아티팩트로 올리고,
      # 업로드가 성공했을 때만 DB 에서 '{}' 로 비운다.
      - name: 피처 스냅샷 내보내기
        id: snapexp
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -q postgresql-client > /dev/null
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)
          echo "CUTOFF=$CUTOFF" >> "$GITHUB_ENV"
          F="snapshots_$(date -u +%Y%m%d).tsv.gz"
          echo "SNAP_FILE=$F" >> "$GITHUB_ENV"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "COPY (
              SELECT id, recommendation_run_id, stock_id, recommended_at, action, score, feature_snapshot_json
              FROM recommendations
              WHERE recommended_at < '$CUTOFF' AND feature_snapshot_json <> '{}'::jsonb
              ORDER BY id) TO STDOUT" | gzip > "$F"
          N=$(gunzip -c "$F" | wc -l)
          echo "SNAP_ROWS=$N" >> "$GITHUB_ENV"
          echo "내보낸 스냅샷 ${N}행 ($(du -h "$F" | cut -f1)), 기준 < $CUTOFF"

      - name: 피처 스냅샷 업로드
        id: snapup
        if: ${{ !cancelled() && steps.snapexp.outcome == 'success' && env.SNAP_ROWS != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SNAP_FILE }}
          path: ${{ env.SNAP_FILE }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: 피처 스냅샷 DB 에서 비우기 (업로드 성공 시에만)
        if: ${{ !cancelled() && steps.snapup.outcome == 'success' }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v expected="$SNAP_ROWS" <<SQL
          BEGIN;
          SELECT count(*) AS n FROM recommendations
            WHERE recommended_at < '$CUTOFF' AND feature_snapshot_json <> '{}'::jsonb \gset
          SELECT (:n = :expected) AS ok \gset
          \if :ok
            UPDATE recommendations SET feature_snapshot_json = '{}'
              WHERE recommended_at < '$CUTOFF' AND feature_snapshot_json <> '{}'::jsonb;
            COMMIT;
          \else
            \echo 행 수 불일치 — 내보낸 :expected 행 vs 현재 :n 행. 비우지 않는다.
            ROLLBACK;
            SELECT 1/0 AS row_count_mismatch;
          \endif
          SQL

      - name: 보존 창 정리 (Neon 512MB 유지)
        # 평가가 실패해도 정리는 돌린다 — 건너뛰면 그날 용량이 그대로 불어난다
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -q postgresql-client > /dev/null
          psql "$DATABASE_URL" -f apps/api/scripts/neon-retention.sql

      - name: 로그 (항상)
        if: always()
        run: |
          echo "===== worker 마지막 120줄 ====="; tail -120 /tmp/worker.log || true
