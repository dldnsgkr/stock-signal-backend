# 서버리스 파이프라인 — EC2 대체. 기존 코드를 그대로 러너 안에서 돌린다:
# Redis(서비스 컨테이너) + analysis(FastAPI) + worker(NestJS) 를 띄우고
# Bull 큐에 run-pipeline 잡 하나를 넣고 완주를 기다린다. DB 는 Neon.
#
# 필요 secrets: NEON_DATABASE_URL (필수), KRX_ID/KRX_PW (KR 수급),
#               VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY/VAPID_SUBJECT (웹푸시 — 없으면 푸시만 비활성)
name: pipeline

on:
  # ⚠️ GitHub cron 은 정각·30분에 몰려 3~7.5시간씩 지연된다(2026-10-13~14 실측).
  #    붐비지 않는 홀수 분으로 지연을 줄이고, 시장은 아래에서 '어느 cron 이 쐈는지'로 판정한다.
  #    (마감 후 다음 개장까지 17.5시간이라 지연돼도 장중 데이터를 잡지는 않는다)
  schedule:
    - cron: '17 7 * * 1-5'    # KR — 장 마감(06:30 UTC) 47분 후
    # US — 마감 직후가 아니라 미 동부 23시대(03:13 UTC, 화~토 = 월~금 세션).
    # ⚠️ UTC 자정(미 동부 20시) 전후로 Yahoo 가 그날 봉을 빼고 준다. 예전 cron(20:43)이
    #    지연돼 23:30 에 시작하면 가격 수집이 자정을 넘는 순간부터 뒤쪽 종목이 전날 데이터만
    #    받아 10-19·10-22 는 커버리지 게이트에 막혔고, 통과한 날도 일부는 전날 값으로 채점됐다.
    #    03:13 은 서머타임 해제 후(위험 구간 01:00 UTC)에도 안전하고, 몇 시간 지연돼도 개장 전이다.
    - cron: '13 3 * * 2-6'
  workflow_dispatch:
    inputs:
      market:
        description: '시장 (KR | US)'
        required: true
        type: choice
        options: [KR, US]
      job:
        description: '실행할 작업 (관리자 화면의 개별 버튼). 기본은 전체 파이프라인'
        required: false
        default: run-pipeline
        type: choice
        options:
          - run-pipeline
          - collect-stock-list
          - collect-prices
          - collect-news
          - collect-financials
          - collect-macro
          - collect-investor-flow
          - generate-recommendations
          - check-sell-signals

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
      ANALYSIS_SERVICE_URL: http://localhost:8000
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: DB 주소 준비 (벌크 작업은 직결 — 풀러 경유 금지)
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_URL" ]; then
            echo "::error::NEON_DATABASE_URL secret 이 없습니다 — gh secret set NEON_DATABASE_URL"
            exit 1
          fi
          echo "DATABASE_URL=${NEON_URL/-pooler/}" >> "$GITHUB_ENV"

      - name: 시장 결정 (스케줄은 '어느 cron 인지'로, 수동은 입력으로)
        # ⚠️ 현재 시각으로 판정하지 말 것 — cron 지연으로 4번 연속 시장이 뒤바뀌었다
        #    (US cron 이 자정 넘어 실행 → KR 장중 데이터로 KR 런 생성 등, 2026-10-13~14).
        run: |
          if [ -n "${{ github.event.inputs.market }}" ]; then
            MARKET="${{ github.event.inputs.market }}"
          elif [ "${{ github.event.schedule }}" = "17 7 * * 1-5" ]; then
            MARKET=KR
          elif [ "${{ github.event.schedule }}" = "13 3 * * 2-6" ]; then
            MARKET=US
          else
            echo "::error::알 수 없는 트리거: schedule='${{ github.event.schedule }}'"; exit 1
          fi
          echo "MARKET=$MARKET" >> "$GITHUB_ENV"
          echo "시장: $MARKET"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version 지정 금지 — packageManager 필드와 충돌
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/api prisma:generate
      - run: pnpm -C apps/api build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/analysis-service/requirements.txt
      - run: pip install -r apps/analysis-service/requirements.txt

      - name: analysis 서비스 기동
        working-directory: apps/analysis-service
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/analysis.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && { echo "analysis OK"; exit 0; }
            sleep 2
          done
          echo "::error::analysis 기동 실패"; tail -50 /tmp/analysis.log; exit 1

      - name: worker 기동
        run: |
          nohup node apps/api/dist/main.worker.js > /tmp/worker.log 2>&1 &
          for i in $(seq 1 15); do
            grep -q "Worker process started" /tmp/worker.log && { echo "worker OK"; exit 0; }
            sleep 2
          done
          echo "::error::worker 기동 실패"; tail -50 /tmp/worker.log; exit 1

      - name: 작업 실행 (완주 대기)
        working-directory: apps/api
        # 스케줄 실행은 항상 전체 파이프라인. 수동 실행은 관리자 화면이 고른 개별 작업도 가능 —
        # 큐 이름은 워커의 Bull 큐와 같고, 잡 이름만 큐별로 다르다(admin.service 의 trigger* 와 동일).
        run: |
          JOB="${{ github.event.inputs.job || 'run-pipeline' }}"
          case "$JOB" in
            run-pipeline)              NAME=run ;;
            generate-recommendations)  NAME=generate ;;
            check-sell-signals)        NAME=check ;;
            collect-*)                 NAME=collect ;;
            *) echo "::error::알 수 없는 작업: $JOB"; exit 1 ;;
          esac
          echo "작업: $JOB/$NAME 시장: $MARKET"
          node scripts/run-queue-job.js "$JOB" "$NAME" "{\"market\":\"$MARKET\"}" 135

      - name: 로그 (항상)
        if: always()
        run: |
          echo "===== worker 마지막 120줄 ====="; tail -120 /tmp/worker.log || true
          echo "===== analysis 마지막 300줄 ====="; tail -300 /tmp/analysis.log || true
